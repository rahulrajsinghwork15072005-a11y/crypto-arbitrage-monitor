services:
  backend:
    build: ./backend
    ports:
      - "8002:8002"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Documented hot-state + history tiers (see PLAN.md). The API runs without them
  # today using the synthetic feed; provided here so the production tiers can be
  # wired in (Redis for live books / pub-sub, Postgres for opportunity history).
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arbitrage
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
